    <rect x="325" y="190" width="4" height="4" rx="1" /><rect x="345" y="190" width="4" height="4" rx="1" /><rect x="365" y="190" width="4" height="4" rx="1" />
    <rect x="325" y="210" width="4" height="4" rx="1" /><rect x="345" y="210" width="4" height="4" rx="1" /><rect x="365" y="210" width="4" height="4" rx="1" />
    <rect x="325" y="230" width="4" height="4" rx="1" /><rect x="365" y="230" width="4" height="4" rx="1" />
    <rect x="345" y="250" width="4" height="4" rx="1" />

    <rect x="670" y="195" width="4" height="4" rx="1" /><rect x="690" y="195" width="4" height="4" rx="1" /><rect x="710" y="195" width="4" height="4" rx="1" />
    <rect x="670" y="215" width="4" height="4" rx="1" /><rect x="690" y="215" width="4" height="4" rx="1" />
    <rect x="690" y="235" width="4" height="4" rx="1" /><rect x="710" y="235" width="4" height="4" rx="1" />

    <rect x="1245" y="285" width="4" height="4" rx="1" /><rect x="1265" y="285" width="4" height="4" rx="1" /><rect x="1285" y="285" width="4" height="4" rx="1" />
    <rect x="1245" y="305" width="4" height="4" rx="1" /><rect x="1285" y="305" width="4" height="4" rx="1" />
    <rect x="1265" y="325" width="4" height="4" rx="1" />

    <rect x="1150" y="260" width="4" height="4" rx="1" /><rect x="1170" y="260" width="4" height="4" rx="1" /><rect x="1190" y="260" width="4" height="4" rx="1" />
    <rect x="1150" y="280" width="4" height="4" rx="1" /><rect x="1190" y="280" width="4" height="4" rx="1" />
    <rect x="1170" y="300" width="4" height="4" rx="1" />

    <rect x="1845" y="300" width="4" height="4" rx="1" /><rect x="1865" y="300" width="4" height="4" rx="1" /><rect x="1885" y="300" width="4" height="4" rx="1" />
    <rect x="1845" y="320" width="4" height="4" rx="1" /><rect x="1865" y="320" width="4" height="4" rx="1" />
  </g>

  <!-- Antenna warning beacons -->
  <circle cx="182" cy="140" r="2.5" fill="#EF4444" opacity="0.95" />
  <circle cx="703" cy="120" r="2.5" fill="#EF4444" opacity="0.95" />
  <circle cx="1148" cy="95" r="2.5" fill="#EF4444" opacity="0.95" />
  <circle cx="1265" cy="50" r="2.5" fill="#EF4444" opacity="0.95" />
  <circle cx="1686" cy="130" r="2.5" fill="#EF4444" opacity="0.95" />
</svg>
